<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Productos - Cafetería</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script>

        function enviarAccion(accion) {

            const seleccionado =
                document.querySelector(
                    'input[name="id_producto_sel"]:checked'
                );


            // =====================================
            // AGREGAR
            // =====================================

            if (accion === "agregar") {

                window.location.href =
                    "/agregar_producto";

                return;
            }


            // =====================================
            // COMPROBAR SELECCIÓN
            // =====================================

            if (!seleccionado) {

                alert(
                    "Por favor, selecciona un producto."
                );

                return;
            }


            const id = seleccionado.value;


            // =====================================
            // ACTUALIZAR
            // =====================================

            if (accion === "actualizar") {

                window.location.href =
                    "/actualizar_producto/" + id;

                return;
            }


            // =====================================
            // BORRAR
            // =====================================

            if (accion === "borrar") {

                if (
                    confirm(
                        "¿Seguro que deseas borrar el producto ID " +
                        id +
                        "?"
                    )
                ) {

                    const form =
                        document.getElementById(
                            "form-productos"
                        );

                    form.action =
                        "/borrar_producto/" + id;

                    form.method = "POST";

                    form.submit();
                }

            }

        }

    </script>

</head>


<body>

    <div class="container">

        <h1>Lista de Productos</h1>


        <a href="/" class="btn-back">
            ← Volver al Inicio
        </a>

        <br>
        <br>


        <form id="form-productos">

            <table>

                <thead>

                    <tr>

                        <th>Sel.</th>

                        <th>ID Producto</th>

                        <th>Nombre</th>

                        <th>Categoría</th>

                        <th>Precio</th>

                        <th>Stock</th>

                    </tr>

                </thead>


                <tbody>

                    {% if productos %}

                        {% for p in productos %}

                        <tr>

                            <td>

                                <input
                                    type="radio"
                                    name="id_producto_sel"
                                    value="{{ p.id_producto }}"
                                >

                            </td>


                            <td>
                                {{ p.id_producto }}
                            </td>


                            <td>
                                {{ p.nombre }}
                            </td>


                            <td>
                                {{ p.categoria }}
                            </td>


                            <td>
                                ${{ "%.2f"|format(p.precio) }}
                            </td>


                            <td>
                                {{ p.stock }}
                            </td>

                        </tr>

                        {% endfor %}

                    {% else %}

                        <tr>

                            <td colspan="6">
                                No hay productos registrados.
                            </td>

                        </tr>

                    {% endif %}

                </tbody>

            </table>

        </form>


        <br>


        <div class="btn-group">

            <button
                type="button"
                class="btn"
                onclick="enviarAccion('agregar')"
            >
                Agregar
            </button>


            <button
                type="button"
                class="btn"
                onclick="enviarAccion('actualizar')"
            >
                Actualizar
            </button>


            <button
                type="button"
                class="btn"
                onclick="enviarAccion('borrar')"
            >
                Borrar
            </button>

        </div>

    </div>

</body>

</html>
