<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agregar Pedido</title>

</head>


<body>

    <div class="container">

        <h1>Agregar Nuevo Pedido</h1>


        <form
            action="{{ url_for('agregar_pedido') }}"
            method="POST"
        >

            <label for="id_cliente">
                ID Cliente:
            </label>

            <br>

            <input
                type="number"
                id="id_cliente"
                name="id_cliente"
                required
            >

            <br>
            <br>


            <label for="fecha_pedido">
                Fecha del Pedido:
            </label>

            <br>

            <input
                type="date"
                id="fecha_pedido"
                name="fecha_pedido"
                required
            >

            <br>
            <br>


            <label for="estado">
                Estado:
            </label>

            <br>

            <select
                id="estado"
                name="estado"
                required
            >

                <option value="Pendiente">
                    Pendiente
                </option>

                <option value="En proceso">
                    En proceso
                </option>

                <option value="Completado">
                    Completado
                </option>

                <option value="Cancelado">
                    Cancelado
                </option>

            </select>

            <br>
            <br>


            <button type="submit">
                Guardar Pedido
            </button>

        </form>


        <br>

        <a href="{{ url_for('pedidos') }}">
            Volver a la lista de pedidos
        </a>

    </div>

</body>

</html>
