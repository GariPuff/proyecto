<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>agregar_Producto</title>

</head>

<body>

    <div class="container">

        <h1>Agregar Nuevo Producto</h1>

        <form
            action="{{ url_for('agregar_producto') }}"
            method="POST"
        >

            <label for="nombre">
                Nombre:
            </label>

            <br>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

            <br>
            <br>


            <label for="categoria">
                Categoría:
            </label>

            <br>

            <input
                type="text"
                id="categoria"
                name="categoria"
                required
            >

            <br>
            <br>


            <label for="precio">
                Precio:
            </label>

            <br>

            <input
                type="number"
                id="precio"
                name="precio"
                step="0.01"
                min="0"
                required
            >

            <br>
            <br>


            <label for="stock">
                Stock:
            </label>

            <br>

            <input
                type="number"
                id="stock"
                name="stock"
                min="0"
                required
            >

            <br>
            <br>


            <button type="submit">
                Guardar Producto
            </button>

        </form>

        <br>

        <a href="{{ url_for('productos') }}">
            Volver a la lista de productos
        </a>

    </div>

</body>

</html>
